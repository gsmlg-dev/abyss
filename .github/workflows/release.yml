name: release

on:
  workflow_dispatch:
    inputs:
      release-version:
        required: true
        description: 'Committed shared version and bare tag (for example 0.9.0)'
      git-ref:
        required: true
        description: 'Exact commit, tag or branch to release'
        default: 'main'

permissions:
  contents: write

# One repository-wide publication lane, including different requested versions.
concurrency:
  group: coordinated-hex-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate, publish and verify both packages
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      RELEASE_VERSION: ${{ inputs.release-version }}
      ARTIFACTS: ${{ github.workspace }}/release-artifacts

    steps:
      - name: Check out the selected release source once
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git-ref }}
          fetch-depth: 0

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.18'

      - name: Set up Rust for the optional native package
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux wire fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes iproute2 util-linux python3

      - name: Validate package set, committed versions and release helpers
        run: |
          python3 scripts/release/release.py check --version "$RELEASE_VERSION" --committed
          python3 -m unittest discover -s scripts/release -p 'test_*.py' -v
          python3 -m py_compile scripts/release/release.py scripts/release/verify_consumers.py

      - name: Validate both package projects
        run: |
          for package in . packages/abyss_raw; do
            (
              cd "$package"
              mix deps.get
              mix format --check-formatted
              MIX_ENV=test mix compile --warnings-as-errors
              mix test
              mix docs --warnings-as-errors
            )
          done

      - name: Verify the supported published QUIC idle policy and keepalive
        working-directory: examples/quic_echo
        run: |
          mix deps.get
          mix run --no-start ../../scripts/phase1/idle_policy.exs

      - name: Build both immutable archives from the selected commit
        run: python3 scripts/release/release.py build --version "$RELEASE_VERSION" --artifacts "$ARTIFACTS"

      - name: Verify archive consumers, legacy compatibility and Linux wire traffic
        run: |
          python3 scripts/release/verify_consumers.py --version "$RELEASE_VERSION" \
            --artifacts "$ARTIFACTS" --legacy --wire --output "$ARTIFACTS/local-consumers.json"

      - name: Publish one coordinated GitHub and Hex release, then verify Hex consumers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: python3 scripts/release/release.py publish --version "$RELEASE_VERSION" --artifacts "$ARTIFACTS"

      - name: Retain release artifacts and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coordinated-release-${{ inputs.release-version }}
          path: release-artifacts/
          if-no-files-found: warn
