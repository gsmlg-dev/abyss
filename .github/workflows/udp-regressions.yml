name: UDP Regression Matrix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  regressions:
    name: ${{ matrix.os }} / OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            otp: '27'
            elixir: '1.18'
          - os: ubuntu-latest
            otp: '28'
            elixir: '1.18'
          - os: macos-14
            otp: '28'
            elixir: '1.18'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - name: Cache dependencies by operating system and runtime
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: udp-${{ runner.os }}-${{ runner.arch }}-otp${{ matrix.otp }}-elixir${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
      - name: Fetch locked dependencies
        run: mix deps.get
      - name: Create macOS wrong-peer loopback fixture
        if: runner.os == 'macOS'
        id: macos_loopback_fixture
        run: |
          loopback_state="$(ifconfig lo0)"
          if awk '$1 == "inet" && $2 == "127.0.0.2" { found = 1 } END { exit !found }' <<< "$loopback_state"; then
            echo '::error::127.0.0.2 already exists on lo0; refusing to adopt a pre-existing alias'
            exit 1
          fi
          sudo ifconfig lo0 inet 127.0.0.2 netmask 255.0.0.0 alias
          echo 'created=true' >> "$GITHUB_OUTPUT"
          loopback_state="$(ifconfig lo0)"
          awk '$1 == "inet" && $2 == "127.0.0.2" { found = 1 } END { exit !found }' <<< "$loopback_state"
      - name: Portable handler, admission, client and option regressions
        run: |
          mix test \
            test/abyss/datagram_test.exs \
            test/abyss/datagram_config_test.exs \
            test/abyss/endpoint_contract_test.exs \
            test/abyss/datagram_runtime_test.exs \
            test/abyss/metadata_requirements_test.exs \
            test/abyss/udp_peer_validation_test.exs \
            test/abyss/udp_backend_resolution_test.exs \
            test/abyss/handler_test.exs \
            test/abyss/handler_hardening_test.exs \
            test/abyss/connection_test.exs \
            test/abyss/connection_admission_test.exs \
            test/abyss/telemetry_test.exs \
            test/abyss/telemetry_metrics_test.exs \
            test/abyss/telemetry_endpoint_test.exs \
            test/abyss/table_owner_scope_test.exs \
            test/abyss/client_test.exs \
            test/abyss/transport/udp/options_regression_test.exs \
            test/abyss/transport/udp/core_test.exs \
            --cover --export-coverage udp-portable
      - name: Remove owned macOS loopback fixture
        if: always() && runner.os == 'macOS' && steps.macos_loopback_fixture.outputs.created == 'true'
        run: sudo ifconfig lo0 inet 127.0.0.2 -alias
      - name: Linux multicast, packet integrity and host lifecycle regressions
        if: runner.os == 'Linux'
        run: |
          mix test \
            test/abyss/transport/native_test.exs \
            test/abyss/client_regression_test.exs \
            test/abyss/transport/udp/multicast_regression_test.exs \
            test/abyss/transport/udp_test.exs \
            test/abyss/udp_host_hardening_test.exs \
            test/abyss/udp_membership_host_test.exs \
            test/abyss/udp_admission_test.exs \
            --cover --export-coverage udp-linux
      - name: Effective backend in fresh booted VMs
        if: runner.os == 'Linux'
        run: bash scripts/udp/backend_boot.sh
      - name: Linux bounded admission stress
        if: runner.os == 'Linux'
        run: mix run scripts/udp/stress.exs
      - name: Retain scoped coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: udp-${{ runner.os }}-${{ runner.arch }}-otp${{ matrix.otp }}
          path: cover/*.coverdata
          if-no-files-found: ignore
